services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: krtakan_ai }
    ports: ["5432:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
  web:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [db]
  worker:
    build: .
    command: ["npx","tsx","src/jobs/worker.ts"]
    env_file: .env
    depends_on: [db]
volumes: { db: {} }
